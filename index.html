<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Task Manager</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    h1 { color: #2c3e50; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 10px; text-align: center; }
    th { background: #3498db; color: white; }
    tr:nth-child(even) { background: #f9f9f9; }
    .edit { background: #2980b9; color: white; border: none; padding: 5px 10px; cursor: pointer; }
    .delete { background: #e74c3c; color: white; border: none; padding: 5px 10px; cursor: pointer; }
    .add { background: #27ae60; color: white; border: none; padding: 5px 15px; cursor: pointer; }
    input { padding: 5px; width: 250px; }
  </style>
</head>
<body>
  <h1>Task Manager</h1>

  <!-- Форма добавления задачи -->
  <input id="newTask" type="text" placeholder="Новая задача">
  <button id="addButton" class="add">Добавить</button>

  <!-- Таблица задач -->
  <table id="taskTable">
    <thead>
      <tr>
        <th>№</th>
        <th>Задача</th>
        <th>Статус</th>
        <th>Действия</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>1</td>
        <td>Купить хлеб</td>
        <td>Не выполнено</td>
        <td>
          <button class="edit">Редактировать</button>
          <button class="delete">Удалить</button>
        </td>
      </tr>
    </tbody>
  </table>

  <script>
    const table = document.querySelector('#taskTable tbody');

    // Добавление новой задачи
    document.querySelector('#addButton').addEventListener('click', () => {
      const input = document.querySelector('#newTask');
      const taskText = input.value.trim();
      if (taskText) {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${table.rows.length + 1}</td>
          <td>${taskText}</td>
          <td>Не выполнено</td>
          <td>
            <button class="edit">Редактировать</button>
            <button class="delete">Удалить</button>
          </td>`;
        table.appendChild(row);
        input.value = '';
      }
    });

    // Делегирование событий для кнопок
    document.querySelector('#taskTable').addEventListener('click', (e) => {
      if (e.target.classList.contains('edit')) {
        const row = e.target.closest('tr');
        const taskCell = row.children[1];
        const newText = prompt('Изменить задачу:', taskCell.textContent);
        if (newText !== null && newText.trim() !== '') {
          taskCell.textContent = newText.trim();
        }
      }

      if (e.target.classList.contains('delete')) {
        e.target.closest('tr').remove();
        // пересчёт номеров
        const rows = document.querySelectorAll('#taskTable tbody tr');
        rows.forEach((r, i) => r.children[0].textContent = i + 1);
      }
    });
  </script>

</body>
</html>
