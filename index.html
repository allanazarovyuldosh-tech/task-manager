<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Task Manager</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    h1 { color: #2c3e50; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 10px; text-align: center; }
    th { background: #3498db; color: white; }
    tr:nth-child(even) { background: #f9f9f9; }
    .edit { background: #2980b9; color: white; border: none; padding: 5px 10px; cursor: pointer; }
    .delete { background: #e74c3c; color: white; border: none; padding: 5px 10px; cursor: pointer; }
    .add { background: #27ae60; color: white; border: none; padding: 5px 15px; cursor: pointer; }
    input { padding: 5px; width: 250px; }
  </style>
</head>
<body>
  <h1>Task Manager</h1>

  <!-- Форма добавления задачи -->
  <input id="newTask" type="text" placeholder="Новая задача">
  <button id="addButton" class="add">Добавить</button>

  <!-- Таблица задач -->
  <table id="taskTable">
    <thead>
      <tr>
        <th>№</th>
        <th>Задача</th>
        <th>Статус</th>
        <th>Действия</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>1</td>
        <td>Купить хлеб</td>
        <td>Не выполнено</td>
        <td>
          <button class="edit">Редактировать</button>
          <button class="delete">Удалить</button>
        </td>
      </tr>
    </tbody>
  </table>
  <script>
  const list = document.querySelector('#taskList');

  document.querySelector('#addButton').addEventListener('click', () => {
    const input = document.querySelector('#newTask');
    const taskText = input.value.trim();
    if (taskText) {
      const item = document.createElement('div');
      item.style.margin = "10px 0";
      item.style.padding = "10px";
      item.style.border = "1px solid #ccc";
      item.style.borderRadius = "6px";
      item.innerHTML = `
        <strong>${taskText}</strong>
        <button class="edit">Редактировать</button>
        <button class="delete">Удалить</button>
      `;
      list.appendChild(item);
      input.value = '';
    }
  });

  // Делегирование событий
  document.querySelector('#taskList').addEventListener('click', (e) => {
    if (e.target.classList.contains('edit')) {
      const item = e.target.closest('div');
      const taskText = item.querySelector('strong');
      const newText = prompt('Изменить задачу:', taskText.textContent);
      if (newText !== null && newText.trim() !== '') {
        taskText.textContent = newText.trim();
      }
    }
    if (e.target.classList.contains('delete')) {
      e.target.closest('div').remove();
    }
  });
</script>

  
   <div id="taskList"></div>

</body>
</html>
